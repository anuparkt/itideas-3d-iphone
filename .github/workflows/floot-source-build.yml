name: ITIDEAS 3D Viewer Build

on:
  push:
    branches: [main]
    paths:
      - 'floot-source/**'
      - '.github/workflows/floot-source-build.yml'
  pull_request:
    paths:
      - 'floot-source/**'
      - '.github/workflows/floot-source-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floot-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build
