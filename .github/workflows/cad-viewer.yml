name: CAD Viewer tests and static build
on:
  push:
    branches: [cloudflare-independent-cad-viewer]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - name: Prepare Cloudflare Pages static output
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: itideas-cad-viewer-dist
          path: dist/
