name: CAD Viewer tests and static build
on:
  push:
    branches: [cloudflare-independent-cad-viewer, cad-v2.3-design-cnc-qa, fix-3mf-mode2d-20261110]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Prepare Cloudflare Pages static output
        run: npm run build
      - name: Smoke test built browser DXF parser
        run: node --test tests/bundle-smoke.test.mjs
      - name: Verify production bundle and offline static assets
        run: node --test tests/build-artifact.test.mjs
      - name: Check browser JS syntax
        run: |
          node --check dist/app.js
          node --check dist/app.bundle.js
          node --check dist/cnc-quality.js
          node --check dist/cad2d.js
          node --check dist/cad-geometry.js
          node --check dist/dxf-parser.bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: itideas-cad-viewer-dist
          path: dist/
